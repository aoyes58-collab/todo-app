<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" <title>My to do list app</title>
  <link rel="stylesheet" href="style.css">


</head>

<body>
  <div class="container">
    <h1>My To-Do List</h1>
    <p>Organize your daily tasks</p>
    <div id="inputlist">
      <input type="text" id="input-area" placeholder="Enter your task">
      <button id="btn">adtask</button>
    </div>
    <div id="stats">
      <span>Total: <b id="total">0</b></span>
      <span>Completed: <b id="completed">0</b></span>
      <span>Pending: <b id="pending">0</b></span>
      <ul id="tasklist"></ul>
    </div>

    <script src="script1.js"></script>
  </div>
</body>

</html>
